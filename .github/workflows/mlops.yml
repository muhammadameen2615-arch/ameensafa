name: Python application

on:
 push:
  branches: ['main']

jobs:
 build:
   runs-on: ubuntu-latest

   steps:
     - uses: actions/checkout@v4

     - name: set up python3.10
       uses: actions/setup-python@v3
       with:
        python-version: "3.10"

     - name: isntall dependencies
       run: pip install -r requirements.txt

     - name: Train
       run: python src/train.py

     - name: Monitoring
       run: python src/monitoring.py

     - name: Test
       run: python -m pytest test/test_train.py -v 

     - name: Upload Model 
       uses: actions/upload-artifact@v4
       with:
         name: iris-model 
         path: model/model.pkl 

     - name: Upload Drift Report 
       uses: actions/upload-artifact@v4
       with:
         name: drift-report 
         path: report/drift-report.html


  

    